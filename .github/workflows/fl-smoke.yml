name: Flower smoke test
on:
  push:
    paths: ['fl_experiment/**', 'data_pipeline/**', 'requirements-*.txt', '.github/workflows/fl-smoke.yml']
  pull_request:
    paths: ['fl_experiment/**', 'data_pipeline/**', 'requirements-*.txt', '.github/workflows/fl-smoke.yml']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-data.txt -r requirements-fl.txt pylint
      - run: pylint fl_experiment
      - run: python -m unittest discover -s fl_experiment/tests -t . -v
      - name: Two-round, ten-state simulation on synthetic smoke data
        run: python -m fl_experiment.run_fl_simulation --rounds 2 --output-dir /tmp/fl-smoke
      - name: Local per-state GRU on synthetic smoke data
        run: python -m fl_experiment.local_gru --epochs 50 --output-dir /tmp/local-gru-smoke
      - name: Rolling-origin naive, SARIMA and GRU on synthetic smoke data
        run: python -m fl_experiment.baselines --order-grid small --epochs 20 --patience 5 --gru-features all --output-dir /tmp/rolling-smoke
      - name: One-seed matched comparison on synthetic smoke data
        run: python -m fl_experiment.compare --skip-references --epochs 2 --patience 1 --seeds 0 --max-rounds 1 --round-patience 1 --local-epochs 1 --feature-sets gst_only --mu-grid 0.01 --alpha-steps 0.1 --output-dir /tmp/compare-smoke
