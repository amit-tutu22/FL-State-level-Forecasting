name: Smoke

on: [push, pull_request]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regenerate synthetic data
        run: python data-generator/generate_state_budget_gst.py
      - name: Centralized baseline
        working-directory: fl_experiment
        run: python centralized_baseline.py
      - name: FL simulation (short)
        working-directory: fl_experiment
        run: python run_fl_simulation.py --rounds 1 --clients 10 --min-clients 5
